<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>會員註冊</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }
    h2 { text-align: center; }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #06c755;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
    }
    #message {
      margin-top: 15px;
      padding: 12px;
      background: #f1f5f5;
      border-radius: 6px;
      text-align: center;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>會員註冊</h2>
    <div id="message">正在連接 LINE...</div>

    <form id="registerForm">
      <label>姓名</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>聯絡電話</label>
      <input type="tel" id="phone" required>

      <label>職稱</label>
      <input type="text" id="position" required>

      <button type="submit" id="submitButton" disabled>
        送出會員註冊
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = '2012517863-3AFi25Mo';
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submitButton');

    let lineUserId = '';

    async function initializeLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          message.textContent = '請先登入 LINE...';
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUserId = profile.userId;

        message.textContent = 'LINE 登入成功！請填寫會員資料。';
        submitButton.disabled = false;

      } catch (error) {
        message.textContent = 'LINE 連線失敗：' + error.message;
      }
    }

    document.getElementById('registerForm')
      .addEventListener('submit', async function(event) {
        event.preventDefault();

        if (!lineUserId) {
          message.textContent = '尚未取得 LINE 使用者資料。';
          return;
        }

        const data = {
          lineUserId,
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          position: document.getElementById('position').value.trim()
        };

        message.textContent = '會員資料準備完成，下一步連接 Google Sheets。';
      });

    initializeLiff();
  </script>
</body>
</html>
