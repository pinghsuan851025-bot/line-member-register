<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>會員註冊</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }
    h2 { text-align: center; }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #06c755;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
    }
    #message {
      margin-top: 15px;
      padding: 12px;
      background: #f1f5f5;
      border-radius: 6px;
      text-align: center;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>會員註冊</h2>
    <div id="message">正在連接 LINE...</div>

    <form id="registerForm">
      <label>姓名</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>聯絡電話</label>
      <input type="tel" id="phone" required>

      <label>職稱</label>
      <input type="text" id="position" required>

      <button type="submit" id="submitButton" disabled>
        送出會員註冊
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = '2012517863-3AFi25Mo';
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submitButton');

    let lineUserId = '';

async function initializeLiff() {
  try {
    message.textContent = 'LIFF SDK 已載入，正在初始化...';

    await liff.init({
      liffId: LIFF_ID,
      withLoginOnExternalBrowser: true
    });

    message.textContent = 'LIFF 初始化完成，正在取得 LINE 資料...';

    if (!liff.isLoggedIn()) {
      message.textContent = '尚未登入 LINE，請重新開啟 LIFF 網址。';
      return;
    }

    const profile = await liff.getProfile();

    if (!profile || !profile.userId) {
      throw new Error('無法取得 LINE User ID');
    }

    lineUserId = profile.userId;

    message.textContent = 'LINE 登入成功！請填寫會員資料。';
    submitButton.disabled = false;

  } catch (error) {
    console.error('LIFF Error:', error);
    message.textContent = 'LINE 連線失敗：' + error.message;
    submitButton.disabled = true;
  }
}

document.getElementById('registerForm')
  .addEventListener('submit', async function(event) {
    event.preventDefault();

    if (!lineUserId) {
      message.textContent = '尚未取得 LINE 使用者資料。';
      return;
    }

    const data = {
      lineUserId,
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      position: document.getElementById('position').value.trim()
    };

    if (!data.name || !data.email || !data.phone || !data.position) {
      message.textContent = '請完整填寫所有資料。';
      return;
    }

    submitButton.disabled = true;
    message.textContent = '會員資料傳送中...';

    try {
      const formData = new URLSearchParams();
      formData.append('payload', JSON.stringify(data));

      await fetch(
        'https://script.google.com/macros/s/AKfycbwemprjyDop7k2qApymXTR1L-sa9nQN0rNIL6o-kt-EO4McSEKoanFjzacj2RDmdCAFhw/exec',
        {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        }
      );

      message.textContent =
        '資料已送出！請稍候確認會員資料是否成功寫入。';

    } catch (error) {
      message.textContent = '傳送失敗：' + error.message;
      submitButton.disabled = false;
    }
  });

        if (!lineUserId) {
          message.textContent = '尚未取得 LINE 使用者資料。';
          return;
        }

        const data = {
          lineUserId,
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          position: document.getElementById('position').value.trim()
        };

        message.textContent = '會員資料準備完成，下一步連接 Google Sheets。';
      });

    initializeLiff();
  </script>
</body>
</html>
